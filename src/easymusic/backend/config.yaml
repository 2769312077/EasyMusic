# EasyMusic Backend 服务配置文件
# 所有配置项均可通过同名环境变量覆盖（LLM 配置域优先从环境变量读取）

app:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "*"

runtime:
  data_dir: "data"
  outputs_dir: "outputs"
  stage_retry_count: 3
  max_music_duration_seconds: 120
  global_single_active_task: true

music_defaults:
  project_name_prefix: "web"
  soundfont_path: "/usr/share/sounds/sf2/FluidR3_GM.sf2"
  mp3_bitrate: "192k"
  note_mode: "llm"
  out_of_bounds_mode: "ignore"

llm:
  # 以下三个配置项均可被同名环境变量覆盖
  # openai_api_key 必须通过环境变量 OPENAI_API_KEY 设置
  openai_api_key: ""
  openai_base_url: ""
  openai_model: "gpt-4o"